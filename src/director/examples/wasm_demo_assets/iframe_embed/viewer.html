<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>director.wasm – Embedded viewer</title>
    <style>
        :root {
            font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
            color: rgba(255, 255, 255, 0.87);
            background-color: #242424;
        }

        /* Fill the iframe so the viewer canvas fills the embedded view. */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #app {
            width: 100%;
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to top, #262a36, #3e4454);
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        #loading-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #loading-overlay .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-top-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loading-overlay .loading-text {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.85);
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <span class="loading-text">Loading 3D view…</span>
        </div>
    </div>

    <script type="module">
        // Panels are hidden by default. Right-click the view to toggle them;
        // the host page changes the background with postMessage.
        import { createViewer } from "/vtk-viewer/viewer.js";

        const WS_PROTOCOL = window.location.protocol === "https:" ? "wss:" : "ws:";
        const overlay = document.getElementById("loading-overlay");
        const container = document.getElementById("app");

        try {
            const viewer = await createViewer({
                container,
                cacheNamespace: "director-wasm-iframe",
                infoUrl: "/api/info",
                statusUrl: (id) => `/api/status/${id}`,
                stateUrl: (id) => `/api/state/${id}`,
                blobUrl: (hash) => `/api/blob/${hash}`,
                wsUrl: `${WS_PROTOCOL}//${window.location.host}/ws/poses`,
            });

            window.addEventListener("message", (event) => {
                if (event.origin !== window.location.origin) return;
                if (event.data?.type === "set-background") {
                    viewer.setBackground(event.data.bottom, event.data.top);
                }
            });

            overlay.classList.add("fade-out");
            setTimeout(() => overlay.remove(), 500);
        } catch (err) {
            overlay.querySelector(".loading-text").textContent = `Error: ${err.message}`;
            overlay.querySelector(".spinner").style.display = "none";
            console.error("[wasm-iframe-viewer]", err);
        }
    </script>
</body>

</html>
