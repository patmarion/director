[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "director"
version = "2.0.0"
description = "Director - A robotics interface and visualization framework using VTK and Qt"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10.16"
dependencies = [
    "vtk>=9.0",
    "qtpy",
    "numpy",
    "scipy",
]

[project.optional-dependencies]

# Extra dependencies. The wasm extra is intentionally not part of this
# meta-group: it pulls in a web server stack (fastapi/uvicorn) that only
# browser-viewer consumers need, so they must request director[wasm]
# explicitly. The wasm static assets ship in every wheel regardless
# (package-data is fixed at build time and cannot vary by extra).
extras = ["director[mujoco,opencv,plot,qtconsole]"]
mujoco = ["mujoco"]
opencv = ["opencv-python"]
plot = [
    "matplotlib",
    "pyqtgraph"
]
qtconsole = [
    "qtconsole",
]
# Browser-based vtk-wasm demos (director.wasm + director/examples/wasm_*)
# uvicorn[standard] pulls in the websockets library the pose stream needs.
# vtk >= 9.6.1 is required because older VTK WASM runtimes (vtkWasmSceneManager)
# lack the sceneManager.set() direct-update API the pose stream relies on.
wasm = [
    "fastapi",
    "httpx",
    "uvicorn[standard]",
    "vtk>=9.6.1",
]

# Qt bindings
pyside = [
    "PySide6<=6.9; sys_platform == 'darwin'",
    "PySide6; sys_platform != 'darwin'",
]
pyqt = [
    "PyQt6<=6.9; sys_platform == 'darwin'",
    "PyQt6; sys_platform != 'darwin'",
]

# Dev, docs, test (wasm included so the wasm examples and tests work in dev
# environments even though the extras meta-group excludes it)
dev = [ "director[extras,pyside,docs,test,wasm]"]
docs = [
    "furo",
    "sphinx",
]
test = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
director = [
    "assets/*.png",
    "assets/*.ui",
    "wasm/viewer_assets/*",
    "examples/wasm_demo_assets/*/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pyflakes (F) and Bugbear (B) for bug-finding, and "I" isort
select = ["F", "B", "I"]
ignore = [
    "E501", # Ignore line-length violations (let the formatter handle it)

    "B007",
    "B006",
    "B019",
    "B904",
    "B905",
]